<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ansh Quiz 💙</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;padding:18px;
 display:flex;align-items:center;justify-content:center;
 font-family:Arial,sans-serif;color:white;text-align:center;
 background:radial-gradient(circle at top,#183c83,#080b20 70%);
}
.page{
 width:100%;max-width:460px;padding:25px 20px;
 border:1px solid #39eaff;border-radius:25px;
 background:#10172deF;box-shadow:0 0 28px #00d9ff55;
}
.hidden{display:none}
.sticker{font-size:100px;filter:drop-shadow(0 0 18px #24eaff)}
h1{font-size:28px;color:#5cecff;text-shadow:0 0 15px #00d9ff}
h2{font-size:22px}
input{
 width:100%;padding:15px;border-radius:12px;
 border:1px solid #47eaff;background:#071128;color:white;
 font-size:17px;margin:16px 0;
}
button{
 border:0;border-radius:12px;padding:14px 18px;
 background:linear-gradient(90deg,#00c8ff,#6b8cff);
 color:#061026;font-size:17px;font-weight:bold;
 cursor:pointer;
}
.mainbtn{width:100%;margin-top:12px}
#questionPhoto{width:100%;height:150px;object-fit:cover;border-radius:15px}
#options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
.option{padding:8px;background:#121f40;color:white;border:1px solid #3eeaff}
.option img{width:100%;height:80px;object-fit:cover;border-radius:8px}
.option span{display:block;margin-top:7px}
.option:disabled{opacity:.9}
.correct{border:3px solid #47ffad!important}
.wrong{border:3px solid #ff6286!important}
#feedback{min-height:25px;color:#69ffb6}
.small{color:#b6c6ed;font-size:13px}
#smiles{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.smile{position:absolute;bottom:-40px;font-size:34px;animation:rise 1.7s linear forwards}
@keyframes rise{to{transform:translateY(-110vh) rotate(360deg);opacity:0}}
</style>
</head>
<body>

<!-- PAGE 1: NAME -->
<section class="page" id="page1">
 <div class="sticker">🤖💙</div>
 <h1>WELCOME FRIEND!</h1>
 <h2>Your Name</h2>
 <input id="nameInput" placeholder="Enter your name..." maxlength="30">
 <button class="mainbtn" onclick="submitName()">SUBMIT ➜</button>
 <p class="small">✨ Ansh Special Quiz ✨</p>
</section>

<!-- PAGE 2: INTRO -->
<section class="page hidden" id="page2">
 <div class="sticker">🤖✨</div>
 <h1 id="welcomeTitle">Hello Friend!</h1>
 <h2>How much do you know about Ansh?</h2>
 <p>💙 Ready to prove your friendship?</p>
 <p>10 Questions • Picture Options • Fun Quiz</p>
 <button class="mainbtn" onclick="startQuiz()">NEXT ➜</button>
</section>

<!-- PAGE 3: QUIZ -->
<section class="page hidden" id="page3">
 <div style="font-size:38px">🤖💙</div>
 <p id="progress">Question 1 / 10</p>
 <img id="questionPhoto" alt="Quiz picture">
 <h2 id="question"></h2>
 <div id="options"></div>
 <p id="feedback"></p>
 <button id="nextBtn" class="mainbtn" hidden onclick="nextQuestion()">NEXT ➜</button>
</section>

<!-- PAGE 4: RESULT -->
<section class="page hidden" id="page4">
 <div class="sticker">🏆🎉</div>
 <h1>QUIZ COMPLETED!</h1>
 <h2 id="finalScore"></h2>
 <p id="finalMessage"></p>
 <button class="mainbtn" onclick="restart()">PLAY AGAIN 🔄</button>
</section>

<div id="smiles"></div>

<script>
const questions=[
 {q:"What is Ansh's favourite chewing gum?",a:0,o:["Boomer","Center Fresh","Orbit","Happydent"],p:["🍬","🫧","🍃","😁"]},
 {q:"What is Ansh's favourite game?",a:1,o:["Football","Chess","Cricket","Ludo"],p:["⚽","♟️","🏏","🎲"]},
 {q:"What are Ansh's favourite colours?",a:2,o:["Red & Yellow","Green & Blue","Black & White","Pink & Purple"],p:["❤️","💚","🖤","💗"]},
 {q:"What is Ansh's favourite fast food?",a:0,o:["Manchurian","Pizza","Burger","Sandwich"],p:["🥘","🍕","🍔","🥪"]},
 {q:"Who is Ansh's favourite teacher?",a:1,o:["Amit Sir","Shiv Rao","Rahul Sir","Vijay Sir"],p:["👨‍🏫","🎓","📚","✏️"]},
 {q:"What is Ansh's favourite subject?",a:3,o:["English","History","Science","Maths"],p:["🔤","🏛️","🔬","➗"]},
 {q:"What is the name of Ansh's friend?",a:0,o:["Bhaskar Yadav","Rohan Sharma","Aman Patil","Rahul Verma"],p:["🤝","😎","🧑‍🤝‍🧑","🌟"]},
 {q:"What is Ansh's favourite sport?",a:2,o:["Cricket","Football","Volleyball","Badminton"],p:["🏏","⚽","🏐","🏸"]},
 {q:"What is Ansh's favourite sweet?",a:1,o:["Gulab Jamun","Jalebi","Rasgulla","Ladoo"],p:["🍮","🥨","🍡","🍬"]},
 {q:"What is Ansh's favourite cartoon?",a:3,o:["Shinchan","Pokemon","Tom and Jerry","Doraemon"],p:["😜","⚡","🐱","🤖"]}
];

let playerName="",idx=0,score=0,answered=false;

function showPage(n){
 for(let i=1;i<=4;i++)
  document.getElementById("page"+i).classList.toggle("hidden",i!==n);
}
function submitName(){
 const name=document.getElementById("nameInput").value.trim();
 if(!name){alert("Please enter your name!");return}
 playerName=name;
 document.getElementById("welcomeTitle").textContent="Hello, "+playerName+"! 💙";
 showPage(2);
}
function picture(emoji,i){
 const colors=[
  ["#18265d","#007f9d"],["#183b68","#5e3290"],
  ["#050505","#646b80"],["#572052","#d87d37"]
 ];
 const c=colors[i%4];
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="300" height="180">
 <defs><linearGradient id="g"><stop stop-color="${c[0]}"/><stop offset="1" stop-color="${c[1]}"/></linearGradient></defs>
 <rect width="300" height="180" rx="16" fill="url(#g)"/>
 <circle cx="150" cy="90" r="55" fill="#fff" fill-opacity=".08" stroke="#70efff" stroke-opacity=".8"/>
 <text x="150" y="114" text-anchor="middle" font-size="68">${emoji}</text>
 </svg>`;
 return "data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(svg);
}
function startQuiz(){
 idx=0;score=0;showPage(3);renderQuestion();
}
function renderQuestion(){
 answered=false;
 const item=questions[idx];
 document.getElementById("progress").textContent=`Question ${idx+1} / ${questions.length}`;
 document.getElementById("question").textContent=item.q;
 document.getElementById("questionPhoto").src=picture(item.p[item.a],0);
 document.getElementById("feedback").textContent="";
 const next=document.getElementById("nextBtn");
 next.hidden=true;
 next.textContent=idx===9?"SEE RESULT 🏆":"NEXT ➜";
 const options=document.getElementById("options");
 options.innerHTML="";
 item.o.forEach((label,i)=>{
  const b=document.createElement("button");
  b.className="option";
  const img=document.createElement("img");
  img.src=picture(item.p[i],i);
  img.alt=label;
  const span=document.createElement("span");
  span.textContent=label;
  b.append(img,span);
  b.onclick=()=>chooseAnswer(i,b);
  options.appendChild(b);
 });
}
function chooseAnswer(i,btn){
 if(answered)return;
 answered=true;
 const item=questions[idx];
 document.querySelectorAll(".option").forEach(b=>b.disabled=true);
 if(i===item.a){
  score++;
  btn.classList.add("correct");
  document.getElementById("feedback").textContent="🎉 Correct! Great job!";
  celebrate();
 }else{
  btn.classList.add("wrong");
  document.querySelectorAll(".option")[item.a].classList.add("correct");
  document.getElementById("feedback").textContent="Correct answer: "+item.o[item.a];
 }
 document.getElementById("nextBtn").hidden=false;
}
function celebrate(){
 const box=document.getElementById("smiles");
 for(let i=0;i<25;i++){
  const s=document.createElement("span");
  s.className="smile";s.textContent=["😊","😁","😄","✨","💙"][i%5];
  s.style.left=Math.random()*100+"%";
  s.style.animationDelay=Math.random()*.4+"s";
  box.appendChild(s);
  setTimeout(()=>s.remove(),2200);
 }
}
function nextQuestion(){
 if(!answered)return;
 idx++;
 if(idx<questions.length){renderQuestion();return}
 showPage(4);
 document.getElementById("finalScore").textContent=`${playerName}, your score is ${score}/10`;
 let message="";
 if(score===10)message="🏆 Amazing! You know Ansh perfectly!";
 else if(score>=7)message="💙 Fantastic! You know Ansh very well!";
 else if(score>=4)message="😊 Good try! Learn more about Ansh!";
 else message="Keep trying! You still have more to learn about Ansh.";
 document.getElementById("finalMessage").textContent=message;
}
function restart(){
 document.getElementById("nameInput").value="";
 playerName="";idx=0;score=0;showPage(1);
}
</script>
</body>
</html>
